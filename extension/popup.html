<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Protection Agent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');

    :root {
      --bg-gradient: linear-gradient(135deg, #090D16 0%, #111A2E 100%);
      --card-bg: rgba(30, 41, 59, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-primary: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --status-active: #10B981;
      --status-glow: rgba(16, 185, 129, 0.3);
      --danger-red: #F87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 330px;
      padding: 20px;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shield-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #38BDF8, #0284C7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 15px var(--accent-glow);
      animation: pulse-glow 3s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 12px var(--accent-glow); }
      100% { box-shadow: 0 0 22px rgba(56, 189, 248, 0.5); }
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(to right, #F8FAFC, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--status-active);
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 0 12px var(--status-glow);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-active);
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {
      75%, 100% { transform: scale(1.5); opacity: 0; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }

    .status-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .status-item:first-child {
      padding-top: 0;
    }

    .label { color: var(--text-muted); font-weight: 500; }
    .val { font-weight: 600; color: #E2E8F0; display: flex; align-items: center; gap: 5px; }

    .val.ok { color: var(--status-active); }
    .val.err { color: var(--danger-red); }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      color: #FFF;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="shield-icon">🛡️</div>
      <div>
        <div class="title">Aegis</div>
        <div class="subtitle">Commitment Guard</div>
      </div>
    </div>
    <div class="badge" id="protection-badge">
      <div class="badge-dot"></div>
      <span id="protection-text">Protected</span>
    </div>
  </div>

  <div class="card">
    <div class="status-item">
      <span class="label">Service API Status</span>
      <span class="val ok" id="api-status">● Connected</span>
    </div>
    <div class="status-item">
      <span class="label">Token State</span>
      <span class="val" id="token-status">Active</span>
    </div>
    <div class="status-item">
      <span class="label">Content Filtering</span>
      <span class="val ok">Enforcing (127.0.0.1:9443)</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="open-dashboard-btn">
      <span>⚙️ Open Management Dashboard</span>
    </button>
    <button class="btn btn-secondary" id="sync-btn">
      <span>🔄 Refresh & Verify Sync</span>
    </button>
  </div>

  <div class="footer">
    Aegis Protection System v1.0.0 • All policies enforced
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
